<!doctype html><meta charset=utf-8><title>relief tuning</title>
<!-- tools/relief_check/tune.html: the relief passes and a copy of the
     composite's sprite response, run on real sprites with the settings in
     tune_variants.json, one row each.  The sprites come from the game: open
     the page with ?lighting=1&normals=2 (the relief atlas's sprite art, magenta
     where transparent), take a screenshot at an integer scale, reduce it to
     game pixels and key out the magenta into art.png next to this page.  That
     file is drawn from your ROM: keep it in build/, never commit it.
     ?art=FILE picks another strip, ?k=N the zoom. -->
<body style="background:#1a1a1a;color:#ddd;font:13px monospace;margin:8px"><div id=g></div>
<script type=module>
const { S } = await import('./glsl.js?v=' + Date.now());
const VAR = window.VARIANTS || (await (await fetch('tune_variants.json?' + Date.now())).json());
const gl = document.createElement('canvas').getContext('webgl2');
const G = 24;
function sh(t, s) { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o);
  if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; }
function prog(fs, rel = true) { const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, '#version 300 es\n' + S.kCommon + S.kCompVs));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, '#version 300 es\n' + S.kCommon + (rel ? S.kRelCommon : 'precision highp sampler2D;\n') + fs));
  gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p)); return p; }
const P = [S.kRel1Fs, S.kRel2Fs, S.kRel3Fs, S.kRel4Fs, S.kRel5Fs].map(f => prog(f));
const SHADE = prog(`
uniform sampler2D uAlbT; uniform sampler2D uNrmT;
uniform vec3 uL; uniform vec4 uP; uniform vec4 uQ;
out vec4 o;
void main() {
  ivec2 p = ivec2(gl_FragCoord.xy);
  vec4 a = texelFetch(uAlbT, p, 0);
  if (a.a < 0.5) { o = vec4(0.16, 0.2, 0.26, 1.0); return; }
  vec3 col = a.rgb;
  if (uP.y <= 0.0) { o = vec4(col, 1.0); return; }
  vec3 N = normalize(texelFetch(uNrmT, p, 0).xyz * 2.0 - 1.0);
  N = normalize(mix(vec3(0.0, 0.0, 1.0), N, uQ.z));
  float amb = uP.x, d0, d1;
  if (uP.w < 0.5) { d0 = amb + (1.0 - amb) * max(uL.z, 0.0); d1 = amb + (1.0 - amb) * max(dot(N, uL), 0.0); }
  else { d0 = amb + (1.0 - amb) * (0.5 + 0.5 * uL.z); d1 = amb + (1.0 - amb) * (0.5 + 0.5 * dot(N, uL)); }
  float f = mix(1.0, clamp(d1 / max(d0, 1e-3), uQ.x, uQ.y), uP.y);
  vec3 c2 = col * f;
  if (uQ.w > 0.5 && f > 1.0) {
    float m = max(max(col.r, col.g), col.b), fe = min(f, 1.0 / max(m, 1e-3));
    c2 = col * fe + (f - fe) * m * 0.3;
  }
  vec3 H = normalize(uL + vec3(0.0, 0.0, 1.0));
  c2 += uP.z * max(pow(max(dot(N, H), 0.0), 20.0) - pow(H.z, 20.0), 0.0) * vec3(1.0, 0.92, 0.75);
  o = vec4(min(c2, vec3(1.0)), 1.0);
}`, false);
function tex(ifmt, fmt, type, w, h, data) { const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texImage2D(gl.TEXTURE_2D, 0, ifmt, w, h, 0, fmt, type, data || null); return t; }
function fbo(t) { const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0); return f; }
const im = new Image(); im.src = (window.ART || new URLSearchParams(location.search).get('art') || 'art.png') + '?' + Date.now(); await im.decode();
const c0 = document.createElement('canvas'); c0.width = im.width; c0.height = im.height;
const x0 = c0.getContext('2d'); x0.drawImage(im, 0, 0); const img = x0.getImageData(0, 0, im.width, im.height);
const w = img.width, h = img.height, W = w + 2 * G, H = h + 2 * G;
const alb = new Uint8Array(W * H * 4);
for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) for (let c = 0; c < 4; c++)
  alb[((y + G) * W + x + G) * 4 + c] = c == 3 ? (img.data[(y * w + x) * 4 + 3] > 127 ? 255 : 0) : img.data[(y * w + x) * 4 + c];
const tA = tex(gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, W, H, alb);
const t1 = tex(gl.RG32UI, gl.RG_INTEGER, gl.UNSIGNED_INT, W, H), t2 = tex(gl.RGBA32UI, gl.RGBA_INTEGER, gl.UNSIGNED_INT, W, H);
const t3 = tex(gl.R32UI, gl.RED_INTEGER, gl.UNSIGNED_INT, W, H), t4 = tex(gl.R32UI, gl.RED_INTEGER, gl.UNSIGNED_INT, W, H);
const tN = tex(gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, W, H), tO = tex(gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, W, H);
const outs = [t1, t2, t3, t4, tN].map(fbo), ins = [null, t1, t2, t3, t4], fO = fbo(tO);
function normals(gen) {
  gl.viewport(0, 0, W, H);
  for (let i = 0; i < 5; i++) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, outs[i]); gl.useProgram(P[i]);
    const u = n => gl.getUniformLocation(P[i], n);
    gl.uniform2i(u('uSize'), W, H); gl.uniform1i(u('uSprY0'), 0);
    gl.uniform4f(u('uGenS'), gen[0], gen[1], gen[2], 0); gl.uniform4f(u('uGenB'), gen[0], gen[1], gen[2], 0);
    gl.activeTexture(gl.TEXTURE10); gl.bindTexture(gl.TEXTURE_2D, tA); gl.uniform1i(u('uAlb'), 10);
    gl.activeTexture(gl.TEXTURE9); gl.bindTexture(gl.TEXTURE_2D, ins[i]); gl.uniform1i(u('uIn'), 9);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
}
function shade(v) {
  const a = (v.angle ?? 35) * Math.PI / 180, z = v.height ?? 0.8;
  const L = [-Math.sin(a), Math.cos(a), z], l = Math.hypot(...L);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fO); gl.useProgram(SHADE);
  const u = n => gl.getUniformLocation(SHADE, n);
  gl.activeTexture(gl.TEXTURE10); gl.bindTexture(gl.TEXTURE_2D, tA); gl.uniform1i(u('uAlbT'), 10);
  gl.activeTexture(gl.TEXTURE9); gl.bindTexture(gl.TEXTURE_2D, tN); gl.uniform1i(u('uNrmT'), 9);
  gl.uniform3f(u('uL'), L[0] / l, L[1] / l, L[2] / l);
  gl.uniform4f(u('uP'), v.amb ?? 0.45, v.w ?? 1, v.shine ?? 0.35, v.half ? 1 : 0);
  gl.uniform4f(u('uQ'), v.lo ?? 0, v.hi ?? 10, v.bend ?? 1, v.hue ? 1 : 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  const res = new Uint8Array(W * H * 4); gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, res);
  return res;
}
const K = window.SCALE || +(new URLSearchParams(location.search).get('k') || 3);
for (const v of VAR) {
  normals(v.gen || [1.15, 6, 1.5]);
  const res = shade(v);
  const t = document.createElement('canvas'); t.width = w; t.height = h;
  const id = new ImageData(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) for (let c = 0; c < 4; c++)
    id.data[(y * w + x) * 4 + c] = res[((y + G) * W + x + G) * 4 + c];
  t.getContext('2d').putImageData(id, 0, 0);
  const c = document.createElement('canvas'); c.width = w * K; c.height = h * K;
  const cx = c.getContext('2d'); cx.imageSmoothingEnabled = false; cx.drawImage(t, 0, 0, w * K, h * K);
  const d = document.createElement('div'); d.style.cssText = 'display:inline-block;margin:0 10px 10px 0;vertical-align:top;max-width:' + (w * K) + 'px'; const lb = document.createElement('div'); lb.textContent = v.name; d.append(lb, c);
  document.getElementById('g').append(d);
}
window.__done = true;
</script>
